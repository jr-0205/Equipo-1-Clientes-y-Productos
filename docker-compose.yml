services:
  clientes:
    build: ./clientes
    container_name: equipo1-clientes
    ports:
      - "${CLIENTES_PORT:-2501}:3001"
    environment:
      PORT: "3001"
      DATABASE_PATH: /data/clientes.db
    volumes:
      - clientes_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  productos:
    build: ./productos
    container_name: equipo1-productos
    ports:
      - "${PRODUCTOS_PORT:-2502}:3002"
    environment:
      PORT: "3002"
      DATABASE_PATH: /data/productos.db
    volumes:
      - productos_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clientes_data:
  productos_data:
